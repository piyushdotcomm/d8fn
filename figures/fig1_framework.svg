<stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#357ABD;stop-opacity:1"/></linearGradient>
<linearGradient id="eg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#5B6ABF;stop-opacity:1"/>
<stop offset="100%" style="stop-color:#4A5AA6;stop-opacity:1"/></linearGradient>
<linearGradient id="ng" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#27AE60;stop-opacity:1"/>
